<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surat Perintah Tugas</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Georgia', 'Times New Roman', serif; background: #e8e4dc; min-height: 100vh; padding: 20px; }
  .app-container { max-width: 1150px; margin: 0 auto; display: grid; grid-template-columns: 360px 1fr; gap: 20px; align-items: start; }

  .form-panel { background: #2c2c2c; border-radius: 4px; padding: 24px; position: sticky; top: 20px; max-height: calc(100vh - 40px); overflow-y: auto; }
  .form-panel h2 { font-family: 'Georgia', serif; color: #c9a84c; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid #444; }
  .section-label { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: #888; margin: 16px 0 8px; }
  .form-group { margin-bottom: 10px; }
  .form-group label { display: block; font-size: 10px; color: #aaa; margin-bottom: 3px; }
  .form-group input, .form-group textarea, .form-group select { width: 100%; background: #1a1a1a; border: 1px solid #444; color: #e8e4dc; padding: 7px 10px; font-size: 11px; font-family: 'Georgia', serif; border-radius: 2px; outline: none; transition: border-color 0.2s; }
  .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: #c9a84c; }
  .form-group textarea { resize: vertical; min-height: 50px; }
  .form-group select option { background: #1a1a1a; }

  .person-block { background: #1a1a1a; border: 1px solid #333; border-radius: 3px; padding: 12px; margin-bottom: 10px; }
  .person-block .person-title { font-size: 10px; color: #c9a84c; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
  .person-select { width: 100%; background: #111; border: 1px solid #555; color: #e8e4dc; padding: 6px 8px; font-size: 11px; font-family: 'Georgia', serif; border-radius: 2px; outline: none; margin-bottom: 8px; cursor: pointer; }
  .person-select:focus { border-color: #c9a84c; }

  .btn-print { width: 100%; background: #c9a84c; color: #1a1a1a; border: none; padding: 12px; font-family: 'Georgia', serif; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; border-radius: 2px; margin-top: 16px; font-weight: bold; transition: background 0.2s; }
  .btn-print:hover { background: #e0bc5e; }
  .btn-add-person { width: 100%; background: transparent; color: #888; border: 1px dashed #444; padding: 7px; font-family: 'Georgia', serif; font-size: 10px; letter-spacing: 1px; cursor: pointer; border-radius: 2px; margin-top: 4px; transition: all 0.2s; }
  .btn-add-person:hover { color: #c9a84c; border-color: #c9a84c; }
  .btn-remove { background: none; border: none; color: #666; font-size: 13px; cursor: pointer; padding: 0; }
  .btn-remove:hover { color: #e05a5a; }

  .preview-panel { background: white; box-shadow: 0 4px 30px rgba(0,0,0,0.2); }
  .doc-page { padding: 40px 50px; min-height: 297mm; font-family: 'Times New Roman', Times, serif; font-size: 12pt; color: #000; line-height: 1.4; }

  .doc-header { display: flex; align-items: center; gap: 16px; border-bottom: 3px solid #000; padding-bottom: 12px; margin-bottom: 16px; }
  .doc-header img { width: 75px; height: 75px; object-fit: contain; flex-shrink: 0; }
  .header-text { flex: 1; text-align: center; }
  .header-text .gov-name { font-size: 13pt; font-weight: normal; letter-spacing: 1px; }
  .header-text .instansi { font-size: 16pt; font-weight: bold; letter-spacing: 1px; }
  .header-text .uptd { font-size: 14pt; font-weight: bold; }
  .header-text .address { font-size: 8pt; margin-top: 3px; }

  .doc-title { text-align: center; margin: 20px 0 4px; }
  .doc-title h2 { font-size: 14pt; font-weight: bold; text-decoration: underline; letter-spacing: 2px; }
  .doc-title .nomor { font-size: 10pt; margin-top: 2px; }
  .doc-subtitle { text-align: center; font-weight: bold; font-size: 11pt; margin: 16px 0 6px; }

  .person-section { margin-bottom: 14px; }
  .field-row { display: grid; grid-template-columns: 140px 10px 1fr; margin-bottom: 2px; font-size: 11pt; }
  .footer-note { margin-top: 20px; font-size: 11pt; }

  .signature-section { margin-top: 30px; display: flex; justify-content: flex-end; }
  .signature-block { text-align: center; min-width: 220px; }
  .signature-block .sig-place-date { font-size: 11pt; }
  .signature-block .sig-title { font-size: 11pt; margin-top: 4px; }
  .signature-space { height: 70px; }
  .signature-block .sig-name { font-size: 11pt; font-weight: bold; text-decoration: underline; }
  .signature-block .sig-nip { font-size: 11pt; }

  @media print {
    body { background: white; padding: 0; }
    .app-container { display: block; }
    .form-panel { display: none; }
    .preview-panel { box-shadow: none; }
    .doc-page { padding: 20mm 25mm; }
  }
</style>
</head>

<div class="app-container">

  <!-- FORM -->
  <div class="form-panel">
    <h2>⚙ Input Surat Tugas</h2>

    <div class="section-label">Identitas Instansi</div>
    <div class="form-group"><label>Pemerintah / Kabupaten</label><input type="text" id="f_pemkab" value="PEMERINTAH KABUPATEN KUTAI KARTANEGARA" oninput="render()"></div>
    <div class="form-group"><label>Dinas</label><input type="text" id="f_dinas" value="DINAS KESEHATAN" oninput="render()"></div>

    <div class="form-group"><label>Alamat</label><input type="text" id="f_alamat" value="Jln. Poros Desa Bukit Pariaman, Kec. Tenggarong Seberang, Rt. 22 No. 313 Kode Pos 75572" oninput="render()"></div>
    <div class="form-group"><label>Email</label><input type="text" id="f_email" value="puskesmassepari.iii@gmail.com" oninput="render()"></div>

    <div class="section-label">Nomor & Keperluan</div>
    <div class="form-group"><label>Nomor Surat</label><input type="text" id="f_nomor" value="P-6640/DINKES/Pusk-SPR III/090.1/10/2025" oninput="render()"></div>
    <div class="form-group"><label>Dalam Rangka</label><textarea id="f_rangka" oninput="render()">Undangan Workshop dan Pendampingan Tata Kelola Dinas Kesehatan Kabupaten Kutai Kartanegara Tahap III</textarea></div>
    <div class="form-group"><label>Tempat Berangkat</label><input type="text" id="f_berangkat" value="Bukit Pariaman ( Puskesmas Separi III )" oninput="render()"></div>
    <div class="form-group"><label>Tempat Tujuan</label><input type="text" id="f_tujuan" value="RSUD A.M Parikesit (Tenggarong)" oninput="render()"></div>
    <div class="form-group"><label>Lamanya</label><input type="text" id="f_lama" value="3 (Tiga) Hari" oninput="render()"></div>
    <div class="form-group"><label>Tanggal Berangkat</label><input type="text" id="f_tgl_brgkt" value="8 Oktober 2025" oninput="render()"></div>
    <div class="form-group"><label>Tanggal Kembali</label><input type="text" id="f_tgl_kembali" value="10 Oktober 2025" oninput="render()"></div>
    <div class="form-group"><label>Beban Anggaran</label><textarea id="f_anggaran" oninput="render()">DPA SKPD Dinas Kesehatan Kabupaten Kutai Kartanegara Sub Kegiatan Pelayanan dan Penunjang Pelayanan BLUD</textarea></div>

    <div class="section-label">Yang Diperintahkan</div>
    <div id="persons-container"></div>
    <button class="btn-add-person" onclick="addPerson()">+ Tambah Orang</button>

    <div class="section-label">Penandatangan</div>
    <div class="form-group"><label>Tempat Dikeluarkan</label><input type="text" id="f_sig_place" value="Bukit Pariaman" oninput="render()"></div>
    <div class="form-group"><label>Tanggal Dikeluarkan</label><input type="text" id="f_sig_date" value="7 Oktober 2025" oninput="render()"></div>
    <div class="form-group"><label>Nama Penandatangan</label><input type="text" id="f_sig_name" value="Yusup Riduan, SKM" oninput="render()"></div>
    <div class="form-group"><label>NIP Penandatangan</label><input type="text" id="f_sig_nip" value="NIP.19680927 199803 1 007" oninput="render()"></div>
    <div class="form-group"><label>Jabatan (di atas nama)</label><input type="text" id="f_sig_jabatan" value="Kepala UPTD Puskesmas Separi III" oninput="render()"></div>

    <button class="btn-print" onclick="window.print()">🖨 Cetak Dokumen</button>
  </div>

  <!-- PREVIEW -->
  <div class="preview-panel">
    <div class="doc-page" id="doc-preview"></div>
  </div>
</div>

let persons = [

];

function buildOptions(selectedIdx) {
  return `<option value="-1" ${selectedIdx === -1 ? 'selected' : ''}>— Pilih Pegawai —</option>` +
    PEGAWAI.map((p, i) => `<option value="${i}" ${selectedIdx === i ? 'selected' : ''}>${p.nama}</option>`).join('');
}

function g(id) { return document.getElementById(id)?.value || ''; }

function selectPegawai(personIdx, pegawaiIdx) {
  if (pegawaiIdx < 0) return;
  const p = PEGAWAI[pegawaiIdx];
  persons[personIdx].idx = pegawaiIdx;
  persons[personIdx].nama = p.nama;
  persons[personIdx].nip = p.nip.replace(/^Nip\s*:\s*/i, '');
  renderForm();
  render();
}

function updatePerson(i, field, val) {
  persons[i][field] = val;
  render();
}

function addPerson() {
  persons.push({ idx: -1, nama: '', nip: '', pangkat: '', jabatan: '' });
  renderForm();
  render();
}

function removePerson(i) {
  persons.splice(i, 1);
  renderForm();
  render();
}

function renderForm() {
  const c = document.getElementById('persons-container');
  c.innerHTML = persons.map((p, i) => `
    <div class="person-block">
      <div class="person-title">
        <span>Orang ${i + 1}</span>
        <button class="btn-remove" onclick="removePerson(${i})">✕</button>
      </div>
      <select class="person-select" onchange="selectPegawai(${i}, parseInt(this.value))">
        ${buildOptions(p.idx)}
      </select>
      <div class="form-group"><label>Nama</label><input type="text" value="${p.nama}" oninput="updatePerson(${i},'nama',this.value)"></div>
      <div class="form-group"><label>NIP/NIK</label><input type="text" value="${p.nip}" oninput="updatePerson(${i},'nip',this.value)"></div>
      <div class="form-group"><label>Pangkat/Golongan</label><input type="text" value="${p.pangkat}" oninput="updatePerson(${i},'pangkat',this.value)"></div>
      <div class="form-group"><label>Jabatan</label><input type="text" value="${p.jabatan}" oninput="updatePerson(${i},'jabatan',this.value)"></div>
    </div>
  `).join('');
}

function row(label, value) {
  return `<div class="field-row"><span>${label}</span><span>:</span><span>${value}</span></div>`;
}

function render() {
  const doc = document.getElementById('doc-preview');
  const personsHTML = persons.map(p => `
    <div class="person-section">
      ${row('Nama', p.nama)}
      ${row('NIP/NIK', p.nip)}
      ${row('Pangkat/Golongan', p.pangkat)}
      ${row('Jabatan', p.jabatan)}
    </div>
  `).join('<div style="margin:8px 0"></div>');

  doc.innerHTML = `
    <div class="doc-header">
      <img src="data:image/jpeg;base64,${LOGO_B64}" alt="Logo Kutai Kartanegara">
      <div class="header-text">
        <div class="gov-name">${g('f_pemkab')}</div>
        <div class="instansi">${g('f_dinas')}</div>
        <div class="uptd">${g('f_uptd')}</div>
        <div class="address">${g('f_alamat')}<br>Email : ${g('f_email')}</div>
      </div>
    </div>
    <div class="doc-title">
      <h2>SURAT PERINTAH TUGAS</h2>
      <div class="nomor">No : ${g('f_nomor')}</div>
    </div>
    <div class="doc-subtitle">KEPALA UNIT PELAKSANA TEKNIS DAERAH PUSKESMAS SEPARI III<br>MEMERINTAHKAN :</div>
    ${personsHTML}
    <div class="person-section" style="margin-top:10px">
      ${row('Dalam rangka', g('f_rangka'))}
      ${row('Tempat Berangkat', g('f_berangkat'))}
      ${row('Tempat Tujuan', g('f_tujuan'))}
      ${row('Lamanya', g('f_lama'))}
      ${row('Tanggal Berangkat', g('f_tgl_brgkt'))}
      ${row('Tanggal Kembali', g('f_tgl_kembali'))}
      ${row('Beban Anggaran', g('f_anggaran'))}
    </div>
    <div class="footer-note">
      <p>Setelah melaksanakan tugas agar membuat laporan.</p>
      <p>Demikian Surat Tugas ini diberikan agar dipergunakan sebagaimana mestinya.</p>
    </div>
    <div class="signature-section">
      <div class="signature-block">
        <div class="sig-place-date">Dikeluarkan di &nbsp;${g('f_sig_place')}</div>
        <div class="sig-place-date">Pada Tanggal &nbsp;&nbsp;${g('f_sig_date')}</div>
        <div class="sig-title">${g('f_sig_jabatan')}</div>
        <div class="signature-space"></div>
        <div class="sig-name">${g('f_sig_name')}</div>
        <div class="sig-nip">${g('f_sig_nip')}</div>
      </div>
    </div>
  `;
}

renderForm();
render();
</script>
</body>
</html>
